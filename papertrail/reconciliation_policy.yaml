      - MANUTENCAO DE CONTA VALOR NEGOCIOS
      - PACOTE M EMPRESA
      - TITULOS CUSTODIA
      - OPERACOES COM TITULOS
      - IMPOSTO DO SELO
      - IMPOSTO SELO
      - IMPOSTO DE SELO
      - COMISSAO
      - COMISSÃO
    required_types:
      supplier-evidence: [1, null]
      bank-anchor: [0, 1]
    expected_page_count:
      supplier-evidence: [1, 2]
      bank-anchor: 1
  - name: bank-only
    match_description: [TRF SEPA+]
    required_types:
      bank-anchor: [1, null]
    expected_page_count: {}
  - name: bank-only
    match_description:
      - TRF P/ PUZZLE MESSAGE - BPI
      - TRANSFERENCIA RECEBIDA
      - TRANSFERÊNCIA RECEBIDA
      - PUZZLE MESSAGE - BPI
    required_types:
      bank-anchor: 1
    expected_page_count:
      bank-anchor: 1
  - name: bank-only
    direction: credit
    required_types:
      bank-anchor: [1, null]
    expected_page_count:
      bank-anchor: 1
  - name: supplier-payment
    direction: debit
